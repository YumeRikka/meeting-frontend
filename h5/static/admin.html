<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>卡密管理</title>
<style>
  :root { --brand:#07c160; --bg:#f2f3f5; --card:#fff; --text:#1f1f1f; --muted:#888; --danger:#fa5151; --line:#e7e7e7; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; background:var(--bg); color:var(--text); }
  .wrap { max-width:560px; margin:0 auto; padding:20px; }
  .card { background:var(--card); border-radius:12px; padding:18px; margin-bottom:16px; box-shadow:0 1px 4px rgba(0,0,0,.05); }
  h1 { font-size:18px; margin:0 0 14px; }
  label { display:block; font-size:13px; color:var(--muted); margin:12px 0 6px; }
  input { width:100%; padding:11px 12px; font-size:15px; border:1px solid var(--line); border-radius:9px; background:#fafafa; outline:none; }
  input:focus { border-color:var(--brand); background:#fff; }
  button { width:100%; padding:13px; font-size:16px; color:#fff; background:var(--brand); border:none; border-radius:9px; margin-top:16px; font-weight:600; }
  button:active { opacity:.85; }
  button.ghost { background:#fff; color:var(--brand); border:1px solid var(--brand); }
  button.mini { width:auto; padding:7px 12px; font-size:13px; margin-top:10px; }
  .row { display:flex; gap:8px; align-items:center; }
  .row input { flex:1; }
  .remember { font-size:13px; color:var(--muted); display:flex; align-items:center; gap:6px; margin-top:10px; }
  .remember input { width:auto; }
  .info { font-size:13px; color:var(--muted); margin-top:12px; line-height:1.7; white-space:pre-wrap; word-break:break-all; }
  .ok { color:var(--brand); }
  .bad { color:var(--danger); }
  table { width:100%; border-collapse:collapse; font-size:13px; margin-top:10px; }
  th, td { border:1px solid var(--line); padding:6px 8px; text-align:left; }
  th { background:#fafafa; color:var(--muted); font-weight:500; }
  .codes { font-family:monospace; font-size:14px; line-height:1.8; }
  .card-row { cursor:pointer; }
  .card-row:hover { background:#f6fff9; }
  .detail { display:none; padding:6px 4px 2px; }
  .detail.open { display:block; }
  .mc-cancel { width:auto; padding:5px 10px; font-size:12px; margin:0; background:var(--danger); }
  .mc-del { width:auto; padding:5px 10px; font-size:12px; margin:0; background:var(--danger); }
  .go-create { background:var(--brand); }
  .pager { display:flex; gap:8px; align-items:center; justify-content:center; margin-top:10px; font-size:13px; color:var(--muted); }
  .pager .pg { width:auto; margin:0; padding:6px 14px; font-size:13px; background:#fff; color:var(--brand); border:1px solid var(--line); border-radius:8px; font-weight:500; }
  .pager .pg:disabled { color:#bbb; border-color:#eee; background:#fafafa; cursor:default; }
  .pager .pg-info { min-width:120px; text-align:center; }
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>生成卡密</h1>
    <label>管理员令牌（ADMIN_TOKEN）</label>
    <input id="token" type="password" placeholder="在 .env 中配置的 ADMIN_TOKEN" />
    <label class="remember"><input type="checkbox" id="remember" /> 记住此密钥（下次自动填入，本机浏览器保存）</label>
    <button class="mini ghost" id="btn-forget" style="display:none">清除记住的密钥</button>
    <label>生成数量</label>
    <input id="count" type="number" min="1" value="5" />
    <label>每张可用次数（额度）</label>
    <input id="quota" type="number" min="1" value="1" />
    <label>有效期（天，留空=长期）</label>
    <input id="days" type="number" min="1" placeholder="如 30" />
    <label>备注（可选）</label>
    <input id="note" placeholder="如：客户A-医学研讨会" />
    <label>单次最长（分钟，默认 180=3 小时）</label>
    <input id="max_dur" type="number" min="1" placeholder="180" />
    <button id="btn-gen">生成</button>
    <div class="info" id="gen-info"></div>
  </div>

  <div class="card hidden" id="list-card">
    <h1>已生成卡密</h1>
    <div class="codes" id="codes-box"></div>
    <button class="ghost" id="btn-copy" style="border:1px solid var(--brand);">复制全部</button>
  </div>

  <div class="card">
    <h1>全部卡密（点击展开会议记录）</h1>
    <button id="btn-list">刷新列表</button>
    <div id="all-list"></div>
    <div class="pager" id="cards-pager"></div>
  </div>

  <div class="card">
    <h1>全部会议记录</h1>
    <button id="btn-meetings">刷新会议记录</button>
    <div id="all-meetings"></div>
    <div class="pager" id="meetings-pager"></div>
  </div>

  <div class="card">
    <button class="go-create" id="btn-go-create">用管理员密钥去建会 →</button>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const API_BASE = (window.API_BASE || "").replace(/\/+$/, "");
const api = (path, body, isGet) => fetch(API_BASE + path, {
  method: isGet ? "GET" : "POST",
  headers: { "Content-Type": "text/plain" },
  body: isGet ? undefined : JSON.stringify(body),
}).then(async r => {
  let data;
  try { data = await r.json(); }
  catch { data = { ok: false, reason: "http_" + r.status }; }
  return { status: r.status, data };
});

// 记住密钥：localStorage
const LS_ADMIN = "mkb_admin_token";
const LS_PREFILL = "mkb_admin_prefill";

function getToken() { return $("token").value.trim(); }

function persistToken() {
  if ($("remember").checked) localStorage.setItem(LS_ADMIN, getToken());
  else localStorage.removeItem(LS_ADMIN);
  $("btn-forget").style.display = $("remember").checked ? "block" : "none";
}

// 页面加载：自动回填记住的密钥并刷新列表
(function restore() {
  const saved = localStorage.getItem(LS_ADMIN);
  if (saved) {
    $("token").value = saved;
    $("remember").checked = true;
    $("btn-forget").style.display = "block";
    loadList();
    loadAllMeetings();
  }
})();

$("btn-forget").onclick = () => {
  localStorage.removeItem(LS_ADMIN);
  localStorage.removeItem(LS_PREFILL);
  $("remember").checked = false;
  $("btn-forget").style.display = "none";
  $("token").value = "";
  $("gen-info").innerHTML = `<span class="ok">已清除记住的密钥</span>`;
};

$("btn-gen").onclick = async () => {
  const token = getToken();
  const count = parseInt($("count").value, 10);
  const quota = parseInt($("quota").value, 10);
  const days = $("days").value.trim() ? parseInt($("days").value, 10) : "";
  const note = $("note").value.trim();
  const maxDur = $("max_dur").value.trim() ? parseInt($("max_dur").value, 10) : "";
  if (!token) { $("gen-info").innerHTML = `<span class="bad">请填写管理员令牌</span>`; return; }
  persistToken();
  $("gen-info").innerHTML = "生成中…";
  const { data } = await api("/api/admin/cards", { token, count, quota, days, note, max_duration_min: maxDur });
  if (!data.ok) {
    const msg = { forbidden:"令牌错误", invalid_params:"参数错误" }[data.reason] || "生成失败";
    $("gen-info").innerHTML = `<span class="bad">${msg}</span>`;
    return;
  }
  $("gen-info").innerHTML = `<span class="ok">已生成 ${data.codes.length} 张卡密</span>`;
  $("codes-box").textContent = data.codes.join("\n");
  $("list-card").classList.remove("hidden");
  loadList();
};

$("btn-copy").onclick = () => {
  if (navigator.clipboard) navigator.clipboard.writeText($("codes-box").textContent);
  $("btn-copy").textContent = "已复制 ✓";
  setTimeout(() => $("btn-copy").textContent = "复制全部", 1500);
};

// ---------- 工具 ----------
function pad2(n){ return String(n).padStart(2, "0"); }
function fmtMc(mc){ return String(mc).replace(/\D/g, "").padStart(9, "0").replace(/(\d{3})(\d{3})(\d{3})/, "$1-$2-$3"); }
function fmtTime(ts){ if(!ts) return "-"; const d = new Date(ts * 1000); return `${d.getMonth()+1}/${d.getDate()} ${pad2(d.getHours())}:${pad2(d.getMinutes())}`; }

function renderMeetings(rows, box, onCancel) {
  if (!rows || !rows.length) { box.innerHTML = `<div class="info">暂无会议记录</div>`; return; }
  let html = `<table><tr><th>会议号</th><th>主题</th><th>时间</th><th>账号</th><th>状态</th><th></th></tr>`;
  rows.forEach(m => {
    const cancelled = m.status === "cancelled";
    html += `<tr><td>${fmtMc(m.meeting_code)}</td><td>${m.subject || ""}</td><td>${fmtTime(m.start)}</td><td>${m.account || ""}</td>`
         +  `<td>${cancelled ? '<span class="bad">已取消</span>' : '<span class="ok">有效</span>'}</td>`
         +  `<td>${cancelled ? "" : `<button class="mc-cancel" data-mc="${m.meeting_code}">取消</button>`}</td></tr>`;
  });
  html += `</table>`;
  box.innerHTML = html;
  if (onCancel) box.querySelectorAll(".mc-cancel").forEach(b => b.onclick = () => onCancel(b.dataset.mc));
}

// ---------- 分页状态 ----------
const PAGE = 15;
let allCards = [], cardsPage = 0;
let allMeetings = [], meetingsPage = 0;

function renderPager(box, total, page, onPage) {
  const pages = Math.max(1, Math.ceil(total / PAGE));
  if (pages <= 1) { box.innerHTML = ""; return; }
  box.innerHTML =
    `<button class="pg" data-p="${page - 1}" ${page <= 0 ? "disabled" : ""}>上一页</button>` +
    `<span class="pg-info">第 ${page + 1} / ${pages} 页（共 ${total} 条）</span>` +
    `<button class="pg" data-p="${page + 1}" ${page >= pages - 1 ? "disabled" : ""}>下一页</button>`;
  box.querySelectorAll(".pg").forEach(b => {
    b.onclick = () => { const p = parseInt(b.dataset.p, 10); if (!isNaN(p)) onPage(p); };
  });
}

// ---------- 全部卡密（可展开 + 删除 + 分页） ----------
async function loadList() {
  const token = getToken();
  if (!token) return;
  const { data } = await api("/api/admin/cards?token=" + encodeURIComponent(token), null, true);
  if (!data.ok) return;
  allCards = data.cards || [];
  cardsPage = 0;
  renderCardsPage();
}
$("btn-list").onclick = loadList;

function renderCardsPage() {
  const token = getToken();
  if (!allCards.length) { $("all-list").innerHTML = `<div class="info">暂无卡密</div>`; $("cards-pager").innerHTML = ""; return; }
  const slice = allCards.slice(cardsPage * PAGE, cardsPage * PAGE + PAGE);
  const rows = slice.map(c => {
    const exp = c.expires_at ? new Date(c.expires_at * 1000).toLocaleDateString() : "长期";
    const state = c.disabled ? "停用" : (c.expires_at && c.expires_at * 1000 < Date.now() ? "过期" : "有效");
    const maxH = c.max_duration_min ? Math.floor(c.max_duration_min / 60) : 3;
    return `<tr class="card-row" data-code="${c.code}"><td>${c.code}</td><td>${c.used}/${c.quota}</td><td>${exp}</td><td>${maxH}h</td><td>${state}</td><td>${c.note || ""}</td>`
         + `<td><button class="mc-del" data-code="${c.code}">删除</button></td></tr>`
         + `<tr class="detail" id="detail-${c.code}"><td colspan="7"><div class="info">载入中…</div></td></tr>`;
  }).join("");
  $("all-list").innerHTML = `<table><tr><th>卡密</th><th>已用/总</th><th>有效期</th><th>单次最长</th><th>状态</th><th>备注</th><th>操作</th></tr>${rows}</table>`;
  $("all-list").querySelectorAll(".card-row").forEach(tr => {
    tr.onclick = async (e) => {
      if (e.target.classList.contains("mc-del")) return;   // 点「删除」不触发展开
      const code = tr.dataset.code;
      const dt = $("detail-" + code);
      if (dt.classList.contains("open")) { dt.classList.remove("open"); return; }
      document.querySelectorAll(".detail.open").forEach(x => x.classList.remove("open"));
      dt.classList.add("open");
      const { data: md } = await api("/api/admin/meetings?token=" + encodeURIComponent(token) + "&code=" + encodeURIComponent(code), null, true);
      if (!md.ok) { dt.querySelector("td").innerHTML = `<div class="info bad">读取失败</div>`; return; }
      renderMeetings(md.meetings, dt.querySelector("td"), (mc) => adminCancel(mc, tr));
    };
  });
  $("all-list").querySelectorAll(".mc-del").forEach(b => {
    b.onclick = (e) => { e.stopPropagation(); deleteCard(b.dataset.code); };
  });
  renderPager($("cards-pager"), allCards.length, cardsPage, (p) => { cardsPage = p; renderCardsPage(); });
}

async function deleteCard(code) {
  if (!confirm(`确定删除卡密 ${code}？删除后该卡密失效（已建会议记录仍保留在「全部会议记录」中）。`)) return;
  const token = getToken();
  const { data } = await api("/api/admin/card/delete", { token, code });
  if (!data.ok) { alert("删除失败：" + (data.reason || "") + (data.detail ? " " + data.detail : "")); return; }
  loadList();   // 重新载入并回到首页
}

// ---------- 全部会议记录（分页） ----------
async function loadAllMeetings() {
  const token = getToken();
  if (!token) return;
  const { data } = await api("/api/admin/meetings?token=" + encodeURIComponent(token), null, true);
  if (!data.ok) { $("all-meetings").innerHTML = `<div class="info bad">读取失败（令牌错误？）</div>`; $("meetings-pager").innerHTML = ""; return; }
  allMeetings = data.meetings || [];
  meetingsPage = 0;
  renderMeetingsPage();
}
$("btn-meetings").onclick = loadAllMeetings;

function renderMeetingsPage() {
  const slice = allMeetings.slice(meetingsPage * PAGE, meetingsPage * PAGE + PAGE);
  renderMeetings(slice, $("all-meetings"), (mc) => adminCancel(mc));
  renderPager($("meetings-pager"), allMeetings.length, meetingsPage, (p) => { meetingsPage = p; renderMeetingsPage(); });
}

// 管理员取消：成功后刷新两个视图
async function adminCancel(mc, tr) {
  const token = getToken();
  const { data } = await api("/api/admin/meeting/cancel", { token, meeting_code: mc });
  if (!data.ok) { alert("取消失败：" + (data.reason || "") + (data.detail ? " " + data.detail : "")); return; }
  loadAllMeetings();
  // 刷新展开中的卡密详情
  document.querySelectorAll(".detail.open").forEach(async dt => {
    const code = dt.id.replace("detail-", "");
    const { data: md } = await api("/api/admin/meetings?token=" + encodeURIComponent(token) + "&code=" + encodeURIComponent(code), null, true);
    if (md.ok) renderMeetings(md.meetings, dt.querySelector("td"), (m) => adminCancel(m, tr));
  });
}

// ---------- 用管理员密钥去建会 ----------
$("btn-go-create").onclick = () => {
  const token = getToken();
  if (!token) { alert("请先填写管理员密钥"); return; }
  persistToken();
  localStorage.setItem(LS_PREFILL, token);  // 共享给用户端预填（不进 URL）
  window.location.href = (API_BASE || "") + "/?from=admin";
};
</script>
</body>
</html>
